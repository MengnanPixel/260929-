name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/HeroFlow-Live-Wallpaper.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HeroFlow-Live-Wallpaper-APK
          path: release/HeroFlow-Live-Wallpaper.apk
          if-no-files-found: error
          retention-days: 30
